services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizzer
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d quizzer"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/quizzer
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PYTHONPATH=/app
      - LOG_DIR=/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quizz-network
    working_dir: /app
    volumes:
      - backend_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "coolify.type=application"
      - "coolify.port=8000"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    environment:
      - NODE_ENV=production
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quizz-network
    restart: unless-stopped
    labels:
      - "coolify.type=application"
      - "coolify.port=80"
      - "coolify.main=true"

volumes:
  postgres_data:
  backend_logs:

networks:
  quizz-network:
    driver: bridge